const $$=(s,el)=>Array.from((el||document).querySelectorAll(s));
function toast(msg,ms){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),ms||2600);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ============================================================
   2. 黑格尔思维导图（SVG 树 + 大纲视图）
   ============================================================ */
const HEGEL=DATA.hegel.root;
(function initHegel(){HEGEL._collapsed=false;})();
function walk(n,fn){fn(n);(n.children||[]).forEach(c=>walk(c,fn));}
const NW=210,NH=60,HGAP=52,VGAP=14;
let mmNodes=[],mmEdges=[];
function mmMeasure(n){
  if(!n.children||!n.children.length||n._collapsed)return NH;
  let h=0;n.children.forEach((c,i)=>{h+=mmMeasure(c);if(i)h+=VGAP;});
  return Math.max(NH,h);
}
function mmPlace(n,depth,y){
  const x=30+depth*(NW+HGAP),h=mmMeasure(n),cy=y+h/2;
  n._x=x;n._y=cy;n._h=h;mmNodes.push(n);
  if(n.children&&n.children.length&&!n._collapsed){
    let cy0=cy-h/2;
    n.children.forEach(c=>{
      const ch=mmMeasure(c);
      mmPlace(c,depth+1,cy0);
      mmEdges.push([x+NW,cy,c._x,c._y,depth]);
      cy0+=ch+VGAP;
    });
  }
}
function mmLayout(){mmNodes=[];mmEdges=[];mmPlace(HEGEL,0,0);}
function mmClass(n){
  if(n===HEGEL)return'root';
  if(n.children&&n.children.length&&n.title&&/第.编/.test(n.title))return'book';
  if(n.children&&n.children.length)return'part';
  return'';
}
let mmView={x:0,y:0,k:1};
function mmRender(){
  mmLayout();
  const svg=$('#mmSvg');
  const maxX=Math.max(...mmNodes.map(n=>n._x+NW))+40, maxY=Math.max(...mmNodes.map(n=>n._y))+60;
  svg.setAttribute('viewBox',`0 0 ${maxX} ${maxY}`);
  let s=`<g id="mmG" transform="translate(${mmView.x},${mmView.y}) scale(${mmView.k})">`;
  mmEdges.forEach(([x1,y1,x2,y2])=>{
    const mx=(x1+x2)/2;
    s+=`<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" stroke="#C9BBA0" stroke-width="1.4" fill="none"/>`;
  });
  mmNodes.forEach(n=>{
    const cls=mmClass(n);
    const hasKids=n.children&&n.children.length;
    const title=n.title.length>13?n.title.slice(0,12)+'…':n.title;
    s+=`<g class="mm-node ${cls}" data-id="${n.id}" transform="translate(${n._x},${n._y-NH/2})">
      <rect width="${NW}" height="${NH}" rx="10"/>
      <text x="12" y="${cls==='root'?25:22}" font-size="${cls==='root'?15:13}" font-weight="${cls?'700':'500'}">${esc(title)}</text>
      ${n.de&&cls? `<text class="sub" x="12" y="${cls==='root'?42:39}">${esc(n.de)}</text>`:''}
      ${hasKids?`<g class="toggle" data-toggle="${n.id}" transform="translate(${NW},${NH/2})"><circle r="9"/>${n._collapsed?'<text y="3.5">+</text>':'<text y="3.5">−</text>'}</g>`:''}
    </g>`;
  });
  s+='</g>';
  svg.innerHTML=s;
  // 交互
  const stage=$('#mmStage');
  let drag=null;
  stage.onmousedown=e=>{if(e.target.closest('.mm-node'))return;drag={x:e.clientX,y:e.clientY,ox:mmView.x,oy:mmView.y};stage.classList.add('dragging');};
  addEventListener('mousemove',e=>{if(!drag)return;mmView.x=drag.ox+(e.clientX-drag.x);mmView.y=drag.oy+(e.clientY-drag.y);mmApply();});
  addEventListener('mouseup',()=>{drag=null;stage.classList.remove('dragging');});
  stage.onwheel=e=>{e.preventDefault();const r=stage.getBoundingClientRect();const px=e.clientX-r.left,py=e.clientY-r.top;const k2=mmView.k*(e.deltaY<0?1.12:0.9);const kk=Math.min(2.2,Math.max(0.25,k2));mmView.x=px-(px-mmView.x)*kk/mmView.k;mmView.y=py-(py-mmView.y)*kk/mmView.k;mmView.k=kk;mmApply();};
  // 触屏
  let lastTouch=null;
  stage.addEventListener('touchstart',e=>{if(e.touches.length===1&&!e.target.closest('.mm-node')){lastTouch={x:e.touches[0].clientX,y:e.touches[0].clientY,ox:mmView.x,oy:mmView.y};}},{passive:true});
  stage.addEventListener('touchmove',e=>{if(lastTouch&&e.touches.length===1){mmView.x=lastTouch.ox+(e.touches[0].clientX-lastTouch.x);mmView.y=lastTouch.oy+(e.touches[0].clientY-lastTouch.y);mmApply();}},{passive:true});
  stage.addEventListener('touchend',()=>lastTouch=null);
  $$('.mm-node',svg).forEach(g=>{
    g.onclick=e=>{
      const tg=e.target.closest('[data-toggle]');
      const id=(tg||g).dataset.toggle||g.dataset.id;
      if(tg){const n=mmNodes.find(x=>x.id===id);if(n){n._collapsed=!n._collapsed;mmRender();}return;}
      const n=mmNodes.find(x=>x.id===id);if(n)mmDetail(n);
    };
  });
  if(mmFirst){mmFirst=false;setTimeout(mmFit,60);}
}
function mmApply(){const g=$('#mmG');if(g)g.setAttribute('transform',`translate(${mmView.x},${mmView.y}) scale(${mmView.k})`);}
function mmFit(){
  const stage=$('#mmStage');if(!stage||!stage.clientWidth)return;
  const w=stage.clientWidth,h=stage.clientHeight;
  const maxX=Math.max(...mmNodes.map(n=>n._x+NW))+40,maxY=Math.max(...mmNodes.map(n=>n._y))+60;
  const k=Math.min(w/maxX,h/maxY,1)*0.92;
  mmView.k=k;mmView.x=(w-maxX*k)/2;mmView.y=(h-maxY*k)/2;mmApply();
}
let mmFirst=true;
function mmDetail(n){
  $('#mmDTitle').textContent=n.title;
  $('#mmDDe').textContent=n.de||'';
  $('#mmDSum').textContent=n.summary||'';
  $('#mmDKey').textContent=n.key||'';
  if(n.action){$('#mmDAct').textContent=n.action;$('#mmDLblAct').style.display='block';}else{$('#mmDLblAct').style.display='none';}
  $('#mmDetail').classList.add('show');
}
$('#mmClose').onclick=()=>$('#mmDetail').classList.remove('show');
$('#btnZoomIn').onclick=()=>{mmView.k=Math.min(2.2,mmView.k*1.2);mmApply();};
$('#btnZoomOut').onclick=()=>{mmView.k=Math.max(0.25,mmView.k*0.83);mmApply();};
$('#btnZoomReset').onclick=()=>{mmFit();toast('已重置视图');};
$('#btnExpandAll').onclick=()=>{walk(HEGEL,n=>n._collapsed=false);mmRender();toast('已展开全部 75 节');};
$('#btnCollapseAll').onclick=()=>{walk(HEGEL,n=>{if(n.children&&n.children.length&&n!==HEGEL)n._collapsed=true;});HEGEL._collapsed=false;mmRender();toast('已收起分支');};
$('#mmSearch').addEventListener('input',e=>{
  const q=e.target.value.trim();
  if(!q){$$('.mm-node rect').forEach(r=>r.style.stroke='');return;}
  const hits=[];
  walk(HEGEL,n=>{
    const txt=(n.title+' '+(n.de||'')+' '+(n.summary||'')+' '+(n.key||'')+' '+(n.action||'')).toLowerCase();
    const hit=txt.includes(q.toLowerCase());
    n._hit=hit;if(hit)hits.push(n);
    let p=n;while(p){if(hit)p._collapsed=false;p=p._parent;}
  });
  // 建立父子引用后重新计算折叠
  mmRender();
  $$('.mm-node rect').forEach((r,i)=>{const g=r.closest('.mm-node');r.style.stroke=g.querySelector('text').textContent&&mmNodes[i]&&mmNodes[i]._hit?'#B4432F':'';});
  toast(hits.length?`命中 ${hits.length} 个节点（红色高亮）`:'未找到相关章节');
});
// 父子引用
(function linkParents(){walk(HEGEL,n=>{(n.children||[]).forEach(c=>c._parent=n);});})();

// 大纲视图
function renderOutline(){
  const box=$('#mmOutline');
  function node(n,d){
    const has=n.children&&n.children.length&&!n._collapsed;
    return `<div class="ol-node" data-id="${n.id}">
      <div class="ol-row ${mmClass(n)}"><span class="dot"></span><div><span class="ol-title">${esc(n.title)}</span>${n.de?`<span class="de">${esc(n.de)}</span>`:''}<div class="ol-sum">${esc(n.summary||'')}</div></div></div>
      ${has?`<div class="ol-children">${n.children.map(c=>node(c,d+1)).join('')}</div>`:''}
    </div>`;
  }
  box.innerHTML=node(HEGEL,0);
  $$('.ol-row',box).forEach(r=>{
    r.onclick=()=>{
      const nd=$$('.ol-node',box).find(x=>x.dataset.id===r.parentElement.dataset.id);
      const data=mmNodes.find(x=>x.id===r.parentElement.dataset.id);
      if(data&&data.children&&data.children.length){data._collapsed=!data._collapsed;renderOutline();mmRender();}
      if(data)mmDetail(data);
    };
  });
}
$('#btnMapView').onclick=()=>{$('#btnMapView').classList.add('active');$('#btnOutlineView').classList.remove('active');$('#mmStage').style.display='block';$('#mmOutline').classList.remove('show');};
$('#btnOutlineView').onclick=()=>{$('#btnOutlineView').classList.add('active');$('#btnMapView').classList.remove('active');$('#mmStage').style.display='none';$('#mmOutline').classList.add('show');};

}

$('#thForm').addEventListener('submit',e=>{

/* ---------- 后台 ---------- */
$('#adminBtn').onclick=async()=>{
  const modal=$('#adminModal');modal.classList.add('show');
  const hash=LS.get('xz.adminHash','');
  if(!hash){$('#adminGate').style.display='block';$('#adminBody').style.display='none';}
  else await adminLogin(true);
};
$('#adminGateSet').onclick=async()=>{
  const p1=$('#adminPwd1').value,p2=$('#adminPwd2').value;
  if(p1.length<4){toast('密码至少4位');return;}
  if(p1!==p2){toast('两次输入不一致');return;}
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p1));
  LS.set('xz.adminHash',Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''));
  toast('后台密码已设置');await adminLogin(true);
};
async function adminLogin(silent){
  const hash=LS.get('xz.adminHash','');
  const gate=$('#adminGate'),body=$('#adminBody');
  if(!hash){gate.style.display='block';body.style.display='none';return false;}
  if(silent){gate.style.display='none';body.style.display='block';renderAdmin();return true;}
  return true;
}
$('#adminEnter').onclick=async()=>{
  const p=$('#adminPwd').value;
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));
  const h=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  if(h===LS.get('xz.adminHash','')){$('#adminGate').style.display='none';$('#adminBody').style.display='block';renderAdmin();toast('欢迎回来，站长');}
  else toast('密码错误');
};
function renderAdmin(){
  const list=LS.get('xz.submissions',[]);
  const box=$('#adminList');
  if(!list.length){box.innerHTML='<div class="admin-empty">暂无倾诉。树洞开放后，投稿会出现在这里。</div>';}
  else box.innerHTML=list.map(s=>`
    <div class="sub-item" data-id="${s.id}">
      <div class="sub-head"><b>${esc(s.name)}</b><span class="sub-meta">${s.age} · ${new Date(s.ts).toLocaleString('zh-CN')} · ${s.id}</span></div>
      <div class="sub-body"><b>真实需求：</b>${esc(s.need)}${s.oppress?`<br><b>结构性压迫：</b>${esc(s.oppress)}`:''}<br><b>倾诉内容：</b>${esc(s.grievance)}${s.contact?`<br><b>联系方式：</b>${esc(s.contact)}`:''}${s.allowPublic?'<br><b>已授权匿名公开引用</b>':''}</div>
      <div class="sub-actions">
        <button class="mini-btn" data-act="status">${s.status==='pending'?'标记：待安慰':s.status==='comforted'?'标记：已安慰':'标记：已回信'}</button>
        <button class="mini-btn" data-act="reply">写回信</button>
        <button class="mini-btn" data-act="del">删除</button>
      </div>
      ${s.reply?`<div class="sub-reply">📮 已回信：${esc(s.reply)}</div>`:''}
      <div class="sub-reply-form" style="display:none;margin-top:8px">
        <textarea rows="3" style="width:100%;border-radius:10px;border:1px solid var(--line);padding:10px;font-family:var(--sans);font-size:13px" placeholder="给TA的回信（会保存在本地）">${esc(s.reply||'')}</textarea>
        <button class="mini-btn" data-act="savereply" style="margin-top:6px">保存回信</button>
      </div>
    </div>`).join('');
  $$('.sub-item',box).forEach(item=>{
    const id=item.dataset.id;
    $$('.mini-btn',item).forEach(b=>b.onclick=async()=>{
      const list=LS.get('xz.submissions',[]);const i=list.findIndex(x=>x.id===id);if(i<0)return;
      const act=b.dataset.act;
      if(act==='status'){list[i].status=list[i].status==='pending'?'comforted':list[i].status==='comforted'?'replied':'pending';LS.set('xz.submissions',list);renderAdmin();}
      if(act==='reply'){const f=$('.sub-reply-form',item);f.style.display=f.style.display==='none'?'block':'none';}
      if(act==='savereply'){list[i].reply=$('textarea',item.parentElement).value;LS.set('xz.submissions',list);renderAdmin();toast('回信已保存');}
      if(act==='del'){if(confirm('确定删除这条倾诉？此操作不可恢复。')){list.splice(i,1);LS.set('xz.submissions',list);renderAdmin();toast('已删除');}}
    });
  });
  // 统计
  const p=list.filter(s=>s.status==='pending').length;
  $('#adminStats').textContent=`共 ${list.length} 条 · 待处理 ${p} 条`;
  // GitHub 设置回填
  const st=LS.get('xz.settings',{});
  $('#ghToken').value=st.ghToken||'';$('#ghRepo').value=st.ghRepo||'';
}
$('#adminExport').onclick=()=>{
  const data=LS.get('xz.submissions',[]);
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='树洞倾诉备份_'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('已导出备份');
};
$('#adminImport').onchange=e=>{

  r.onload=()=>{try{const d=JSON.parse(r.result);if(Array.isArray(d)){LS.set('xz.submissions',d);renderAdmin();toast('导入成功：'+d.length+' 条');}else toast('格式错误');}catch(err){toast('导入失败：'+err.message);}};
  r.readAsText(f);
};
$('#adminNoti').onclick=async()=>{
  if(!('Notification'in window)){toast('此浏览器不支持通知');return;}

$('#adminTest').onclick=()=>{

$('#ghSave').onclick=()=>{
  const st=LS.get('xz.settings',{});
  st.ghToken=$('#ghToken').value.trim();st.ghRepo=$('#ghRepo').value.trim();
  st.email=$('#stEmail').value.trim();
  LS.set('xz.settings',st);toast('已保存到本地（仅本设备）');updateMailto();

$('#stSaveEmail').onclick=()=>{
  const st=LS.get('xz.settings',{});
  st.email=$('#stEmail').value.trim();
  LS.set('xz.settings',st);toast('邮箱已保存');updateMailto();
};
$('#ghSync').onclick=async()=>{
  const st=LS.get('xz.settings',{});
  if(!st.ghToken||!st.ghRepo){toast('请先填写 GitHub Token 与 仓库（owner/repo）');return;}
  const list=LS.get('xz.submissions',[]).filter(s=>!s._synced);
  if(!list.length){toast('没有新投稿需要同步');return;}
  let ok=0;
  for(const s of list){
    try{
      const r=await fetch(`https://api.github.com/repos/${st.ghRepo}/issues`,{
        method:'POST',
        headers:{'Authorization':'token '+st.ghToken,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
        body:JSON.stringify({title:`[树洞] ${s.name} · ${s.age} · ${s.need.slice(0,30)}`,body:`**真实需求**：${s.need}\n\n**结构性压迫**：${s.oppress||'（未填）'}\n\n**倾诉内容**：\n${s.grievance}\n\n**联系方式**：${s.contact||'（未留）'}\n\n> 来自行动者六要素网站树洞 · ${s.ts}`,labels:['树洞']})
      });
      if(r.ok){const all=LS.get('xz.submissions',[]);const i=all.findIndex(x=>x.id===s.id);if(i>=0){all[i]._synced=true;LS.set('xz.submissions',all);}ok++;}
    }catch(e){}
  }
  toast(`已同步 ${ok}/${list.length} 条到 GitHub Issues（手机GitHub App将收到通知）`);
  renderAdmin();
};
$('#adminClose').onclick=()=>$('#adminModal').classList.remove('show');
$('#adminModal').addEventListener('click',e=>{if(e.target.id==='adminModal')e.target.classList.remove('show');});

  {id:'wake',label:'⏰ 7:30 起床 · 安定训练',el:'time'},
  {id:'sport',label:'🏃 运动时段（跑运动 / 有脑竞技）',el:'health'},

  {id:'meal',label:'🥗 饮食纪律（蔬菜餐 · 饮料≤3次）',el:'health'},
  {id:'desire',label:'🔥 欲望审计（爱欲为整体目的服务）',el:'eros'},
  {id:'reflect',label:'🧠 体系反思（复盘 · 处理压着的事）',el:'reason'},
  {id:'live',label:'📺 21:00 直播（行者夜话）',el:'time'}
];
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function renderCheck(){
  const key=todayKey();
  $('#checkDate').textContent='📅 今天是 '+new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'})+' · 完成全部日课可保持行动力火焰 · <span id="streakText" style="color:var(--gold);font-weight:600"></span>';
  const data=LS.get('xz.checkins',{});const today=data[key]||{};
  const els=[...new Set(CHECK_TASKS.map(t=>t.el))];
  const EL_NAME={time:'时间（生命）',health:'健康',money:'钱',relationships:'人际关系',eros:'爱欲 ⚡',reason:'理性 ⚡'};
  $('#checkGrid').innerHTML=els.map(el=>`
    <div class="card check-card">
      <h4><span style="color:${EL_COLORS[el]}">${EL_NAME[el]}</span></h4>
      ${CHECK_TASKS.filter(x=>x.el===el).map(x=>`<label class="check-item ${today[x.id]?'done':''}" data-id="${x.id}"><input type="checkbox" ${today[x.id]?'checked':''}><span class="check-box">✓</span>${esc(x.label)}</label>`).join('')}
    </div>`).join('');
  $$('.check-item').forEach(l=>{
    l.onclick=e=>{
      e.preventDefault();
      const id=l.dataset.id;const d=LS.get('xz.checkins',{});const k=todayKey();
      d[k]=d[k]||{};d[k][id]=!d[k][id];LS.set('xz.checkins',d);
      l.classList.toggle('done',d[k][id]);$('input',l).checked=d[k][id];
      updateStreak();
      const done=CHECK_TASKS.filter(t=>d[k][t.id]).length;
      if(done===CHECK_TASKS.length)toast('🔥 今日日课全部完成！行动力火焰 +1');
    };
  });
  updateStreak();
}
function updateStreak(){
  const d=LS.get('xz.checkins',{});let streak=0;const day=new Date();
  for(;;){
    const k=day.getFullYear()+'-'+String(day.getMonth()+1).padStart(2,'0')+'-'+String(day.getDate()).padStart(2,'0');
    const t=d[k];if(t&&CHECK_TASKS.every(x=>t[x.id]))streak++;else break;
    day.setDate(day.getDate()-1);if(streak>365)break;
  }
  const el=$('#streakText');if(el)el.textContent=streak>0?`🔥 连续 ${streak} 天全勤`:'🔥 今日全勤即可点燃火焰';
}
